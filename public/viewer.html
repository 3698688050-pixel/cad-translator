<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看图 · 图译</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--paper, #f4f7fb); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule, #cdd8e6); flex-wrap: wrap; }
  .bar .sp { flex: 1; }
  .bar output { font: 500 12px/1 var(--mono, ui-monospace, monospace); color: var(--ink-2, #46607d); min-width: 4ch; }
  /* libredwg 按淡色 CAD 配色输出（白线 = 索引色 7），背景必须是深色。 */
  #paper { flex: 1; position: relative; overflow: hidden; cursor: grab; touch-action: none; background: #000; }
  #paper.drag { cursor: grabbing; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* CAD drawings rarely embed fonts; without an explicit stack Chinese falls back to tofu boxes. */
  #paper svg text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Segoe UI', sans-serif; fill: #ffe14d; }
  #paper .msg { position: absolute; inset: 0; display: grid; place-items: center; font: 400 13px/1.7 var(--sans, system-ui); color: #9aa3ad; padding: 24px; text-align: center; }
  .viewer-toggle { display: flex; border: 1px solid var(--rule, #cdd8e6); border-radius: 6px; overflow: hidden; }
  .viewer-toggle button { border: 0; background: none; padding: 5px 10px; font: 500 12px var(--sans, system-ui); color: var(--ink-2, #46607d); cursor: pointer; }
  .viewer-toggle button[aria-pressed='true'] { background: var(--blue-ink, #1a3d63); color: #fff; }
  .hint { font: 400 11px/1 var(--sans, system-ui); color: var(--ink-3, #7b8fa6); }
</style>
</head>
<body>
<div class="bar">
  <strong>图译 · 看图</strong>
  <div class="viewer-toggle" role="group" aria-label="看哪一份">
    <button type="button" id="whichSrc" aria-pressed="false">原图</button>
    <button type="button" id="whichEn" aria-pressed="false">译文</button>
  </div>
  <button type="button" class="ghost" id="fit">复位</button>
  <output id="pct">100%</output>
  <span class="hint">滚轮缩放 · 拖拽平移</span>
  <span class="sp"></span>
  <a class="ghost" id="dl" href="#" hidden>下载 DWG</a>
</div>
<div id="paper"><p class="msg">正在生成图形…</p></div>
<script type="module" src="/viewer.js"></script>
</body>
</html>
